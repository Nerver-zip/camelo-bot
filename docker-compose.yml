name: camelo-bot

services:
  camelo-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      CHROME_PATH: /usr/bin/chromium
    restart: unless-stopped
    volumes:
      - bot-output:/app/src/local/dump
      - camelo-charts:/app/src/local/charts
      - camelo-history:/app/src/automessages/mirrors

volumes:
  bot-output:
    external: true
    name: channel-output
  camelo-charts:
    name: camelo-charts
  camelo-history:
    name: camelo-history
